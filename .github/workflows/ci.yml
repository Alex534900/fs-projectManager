name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe DEPLOY para confirmar el despliegue a produccion"
        required: true


jobs:

  # =====================================================
  # 1. FRONTEND - TEST, LINT Y BUILD
  # =====================================================

  frontend:
    name: Frontend - Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  # =====================================================
  # 2. BACKEND - TEST, LINT Y BUILD
  # =====================================================

  backend:
    name: Backend - Test, Lint & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 3000

    defaults:
      run:
        working-directory: ./backend

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build



  # =====================================================
  # 3. PRUEBAS UNITARIAS + COBERTURA
  # =====================================================

  coverage:

    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npx vitest run --coverage



  # =====================================================
  # 4. PRUEBA E2E CON PLAYWRIGHT + POSTGRESQL
  # =====================================================

  e2e:

    name: Pruebas E2E
    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmanager

        ports:
          - 5432:5432


    env:

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskmanager
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 3000


    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'


      - name: Install frontend dependencies
        run: npm ci


      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci


      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate


      - name: Create database schema
        working-directory: ./backend
        run: npx prisma db push


      - name: Install Chromium
        run: npx playwright install --with-deps chromium


      - name: Run E2E tests
        run: npx playwright test



  # =====================================================
  # 5. MIGRACIONES PRISMA
  # =====================================================

  migraciones:

    name: Migraciones Prisma
    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:16

        env:

          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb


        ports:

          - 5432:5432



    env:

      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb


    defaults:

      run:

        working-directory: ./backend


    steps:


      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node
        uses: actions/setup-node@v5

        with:

          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json


      - name: Install dependencies
        run: npm ci


      - name: Generate Prisma Client
        run: npx prisma generate


      - name: Apply Prisma migrations
        run: npx prisma migrate deploy




  # =====================================================
  # 6. DEPLOY STAGING AUTOMATICO
  # =====================================================


  deploy-staging:


    name: Deploy Staging Railway

    runs-on: ubuntu-latest


    needs:

      - frontend
      - backend
      - coverage
      - e2e
      - migraciones


    if: github.event_name == 'push' && github.ref == 'refs/heads/main'


    env:

      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}


    steps:


      - name: Checkout
        uses: actions/checkout@v5


      - name: Install Railway CLI
        run: npm install -g @railway/cli


      - name: Deploy Railway Staging - Frontend
        run: railway up --service fs-projectManager --ci

      - name: Deploy Railway Staging - Backend
        working-directory: ./backend
        run: railway up --service ravishing-amazement --ci





  # =====================================================
  # 7. DEPLOY PRODUCCION MANUAL
  # =====================================================


  deploy-produccion:


    name: Deploy Producción Manual

    runs-on: ubuntu-latest


    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirmacion == 'DEPLOY'


    env:

      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}



    steps:


      - name: Checkout
        uses: actions/checkout@v5


      - name: Install Railway CLI
        run: npm install -g @railway/cli


      - name: Deploy Railway Production - Frontend
        run: railway up --service fs-projectManager --ci

      - name: Deploy Railway Production - Backend
        working-directory: ./backend
        run: railway up --service ravishing-amazement --ci